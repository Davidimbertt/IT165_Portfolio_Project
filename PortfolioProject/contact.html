<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact | David Imbert</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">David Imbert</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMenu"
        aria-controls="navbarMenu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container text-center text-white">
      <h1 class="display-4 fw-bold">Contact Me</h1>
      <p class="lead">Use the form below to send a message.</p>
    </div>
  </header>

  <main class="section-padding">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card contact-card shadow-sm">
            <div class="card-body">
              <h2 class="mb-4">Contact Form</h2>

              <form id="contactForm">
                <div class="mb-3">
                  <label for="name" class="form-label">Name *</label>
                  <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your name"
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email *</label>
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                  />
                </div>

                <div class="mb-3">
                  <label for="subject" class="form-label">Subject *</label>
                  <input
                    type="text"
                    id="subject"
                    class="form-control"
                    placeholder="Enter a subject"
                  />
                </div>

                <div class="mb-3">
                  <label for="message" class="form-label">Message *</label>
                  <textarea
                    id="message"
                    class="form-control"
                    rows="5"
                    placeholder="Write your message"
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                  Submit Message
                </button>
              </form>

              <p id="formMessage" class="mt-3 fw-bold"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer text-center">
    <div class="container">
      <p class="mb-0">Contact Page | David Imbert</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
